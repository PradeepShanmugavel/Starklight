<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab icon is an SVG with its own gradient, so it renders the same
         against a light or dark browser chrome. `theme-color` is split per
         scheme so the mobile address bar matches the active theme instead of
         always showing the light-mode indigo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Starklight — quality check, topic alignment and solution management for the Examly assessment portal." />
    <title>Starklight ✨ Assessment Tooling</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
